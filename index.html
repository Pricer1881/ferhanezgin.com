  --bg:#F4F6F7; --surface:#FFFFFF; --ink:#1B2630; --muted:#5A6873; --line:#D5DCE1;

  :root:not([data-theme="light"]){
    --bg:#12181D; --surface:#1A2229; --ink:#E4EAEE; --muted:#9AA8B2; --line:#2C3740;

  }
}

  --bg:#12181D; --surface:#1A2229; --ink:#E4EAEE; --muted:#9AA8B2; --line:#2C3740;
  --accent:#5FB7BE; --accent-soft:#1D3236; --total:#E0B45A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;}
img{max-width:100%;}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px;}
a:hover{text-decoration-thickness:2px;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px;}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px;}

/* header */
header.site{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;flex-wrap:wrap;}
.brand{font-weight:700;font-size:18px;color:var(--ink);text-decoration:none;letter-spacing:-.01em;}
nav ul{list-style:none;display:flex;gap:4px;margin:0;padding:0;flex-wrap:wrap;}
nav a{display:block;padding:8px 12px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:500;border-radius:6px;}
nav a:hover{color:var(--ink);background:var(--accent-soft);}
nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0;}

main{min-height:70vh;}
section.page{padding:56px 0 80px;}
h1,h2,h3{letter-spacing:-.015em;line-height:1.2;margin:0;}
h1{font-size:clamp(34px,5vw,48px);font-weight:700;}
h2{font-size:26px;font-weight:700;}
h3{font-size:19px;font-weight:600;}
.lede{font-size:19px;color:var(--muted);max-width:60ch;margin:16px 0 0;}
.placeholder{background:var(--accent-soft);border-radius:3px;padding:0 4px;color:var(--ink);}

/* hero: a pricing procedure */
.hero{display:grid;grid-template-columns:1fr;gap:40px;padding:72px 0 56px;}
@media(min-width:880px){.hero{grid-template-columns:1fr 1.15fr;align-items:center;}}
.hero h1{font-size:clamp(40px,6vw,60px);}
.procedure{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-variant-numeric:tabular-nums;}
.procedure .cap{display:flex;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);}
.procedure table{width:100%;border-collapse:collapse;font-size:15px;}
.procedure td{padding:11px 18px;border-bottom:1px solid var(--line);vertical-align:top;}
.procedure td.step{width:56px;color:var(--muted);}
.procedure td.op{width:30px;font-weight:600;color:var(--accent);text-align:center;}
.procedure td.what small{display:block;color:var(--muted);font-size:13px;margin-top:2px;}
.procedure tr.net td{border-bottom:0;border-top:2px solid var(--ink);font-weight:600;}
.procedure tr.net td.op{color:var(--total);}
.procedure tr.net td.what{color:var(--ink);}
.procedure tbody tr{opacity:1;}
@media (prefers-reduced-motion:no-preference){
  .procedure.animate tbody tr{opacity:0;transform:translateY(4px);animation:line .35s ease forwards;}
  .procedure.animate tbody tr:nth-child(1){animation-delay:.15s}
  .procedure.animate tbody tr:nth-child(2){animation-delay:.35s}
  .procedure.animate tbody tr:nth-child(3){animation-delay:.55s}
  .procedure.animate tbody tr:nth-child(4){animation-delay:.75s}
  .procedure.animate tbody tr:nth-child(5){animation-delay:1.05s}
}
@keyframes line{to{opacity:1;transform:none}}

.btn{display:inline-block;padding:11px 18px;border-radius:6px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--accent);}
.btn.primary{background:var(--accent);color:var(--surface);}
.btn.ghost{color:var(--accent);background:transparent;}

.split{display:grid;grid-template-columns:1fr;gap:32px;border-top:1px solid var(--line);padding-top:40px;}

const POSTS = [
  {
    slug:"delta-accruals-at-volume",
    title:"Delta accruals: keeping rebate accruals honest at volume",
    date:"2026-09-21", tags:["Rebates"], mins:6,
    summary:"Why recalculating every accrual from scratch stops scaling, and what to design up front so delta accruals stay reconcilable.",
    body:`
<p>Rebate accruals look simple on a whiteboard: take the eligible volume, apply the rate, post the liability. The trouble starts when there are thousands of agreements and millions of billing or goods-receipt lines, and every run recalculates everything.</p>
<h2>Full recalculation versus deltas</h2>
<p>A full recalculation re-reads the whole history of an agreement on every run and posts the difference. It's easy to reason about, but run time grows with the history, not with the day's activity. A delta approach only processes documents that are new or changed since the last run, so run time follows actual volume.</p>
<h2>What deltas demand from the design</h2>
<p>Deltas are only as good as the change detection behind them. Before choosing them, I make sure the design answers three questions: what counts as a change to an eligible document, what happens when an agreement's terms change retroactively, and how a missed or failed run is caught up.</p>
<blockquote>If you can't explain how to rebuild an accrual from scratch, you can't trust the delta either.</blockquote>
<h2>Keep a way back to the full picture</h2>
<p>I always keep a controlled full-recalculation option for period end and for agreements whose terms changed. Finance gets a reconciliation report comparing accrued amounts with a full recalculation, so any drift is visible before it reaches the ledger.</p>`
  },
  {
    slug:"access-sequences-in-practice",
    title:"How access sequences actually get evaluated",
    date:"2026-09-14", tags:["Pricing"], mins:6,
    summary:"A worked example of the order SAP searches condition tables, and why the exclusive indicator matters more than most specs admit.",
    body:`
<p>Almost every pricing spec I read describes access sequences as a list of tables. That's accurate, but it hides the part that causes defects: the order of evaluation and what happens when more than one record could match.</p>
<h2>The search, step by step</h2>
<p>For each condition type in the procedure, SAP walks its access sequence from top to bottom. Each access reads one condition table using key fields filled from the document. If an access finds a valid record and the access is marked exclusive, the search stops there.</p>
<div class="tablewrap"><table>
<thead><tr><th>Access</th><th>Table key</th><th>Exclusive</th><th>Found?</th></tr></thead>
<tbody>
<tr><td>10</td><td>Customer / material</td><td>Yes</td><td>No</td></tr>
<tr><td>20</td><td>Price list / material</td><td>Yes</td><td>Yes, 12.40</td></tr>
<tr><td>30</td><td>Material</td><td>Yes</td><td>Not read</td></tr>
</tbody></table></div>
<p>In this example the price list price wins, and the general material price is never read. Remove the exclusive flag on access 20 and the search carries on. The last record found becomes the one used, which is rarely what the business expects.</p>
<h2>What I put in every spec now</h2>
<p>For each access I state the business rule it represents, which document fields feed the key, and one sample record that proves it fires. Testers can then build a scenario per access instead of guessing.</p>
<blockquote>If you can't write a test case for an access, you probably don't need the access.</blockquote>
<p>It's a small discipline, but it has removed a whole class of "wrong price" defects from my projects.</p>`
  },
  {
    slug:"specs-developers-like",
    title:"Writing functional specs developers actually like",
    date:"2026-08-30", tags:["Delivery"], mins:5,
    summary:"Fewer screenshots, more examples. What I've changed in how I write pricing specifications after a lot of build reviews.",
    body:`
<p>A good functional spec is read three times: by the developer who builds it, the tester who proves it, and whoever supports it a year later. Most specs are written for none of them. They're written to be signed off.</p>
<h2>Lead with examples, not rules</h2>
<p>Developers reason well from concrete cases. I now open every calculation section with two or three fully worked examples, including input values, intermediate results and the expected output, before stating the general rule.</p>
<h2>Say what happens when data is missing</h2>
<p>The happy path is rarely where the questions come from. Every input field gets a line saying what the program should do if it's blank, zero or invalid. That single habit cuts clarification rounds more than anything else I've tried.</p>
<h2>Keep decisions separate from design</h2>
<p>I keep a short decision log at the end: what was decided, by whom, and why. It stops the design section from filling up with history, and it answers the "why is it like this?" question later on.</p>`
  },
  {
    slug:"pricing-master-data-triggers",
    title:"Which master data changes should trigger a price update?",
    date:"2026-08-11", tags:["Integration","Pricing"], mins:7,
    summary:"When prices are calculated outside the ERP, deciding which field changes send an update is a design question, not a technical detail.",
    body:`
<p>When pricing moves to an external engine, someone has to decide which changes in the ERP should cause prices to be recalculated and sent again. Get it too narrow and prices go stale. Get it too wide and the interface floods with updates that change nothing.</p>
<h2>Start from the pricing logic, not the tables</h2>
<p>The useful question is not "which fields exist?" but "which fields does any pricing rule actually read?" I build the list by walking every condition type and noting the fields its keys and formulas depend on.</p>
<h2>Classify each field</h2>
<p>Every candidate field goes in one of three groups: it changes the price directly, it changes which price applies, or it only affects reporting. Only the first two should trigger an update.</p>
<h2>Test the negatives too</h2>
<p>Unit tests usually prove that a change sends an update. I add an equal number proving that irrelevant changes don't. Those tests catch the noise before it reaches production.</p>`
  }

let showroom = null, openDemo = null;
const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function unlockShowroom(user, pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user+':'+pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(SHOWROOM.salt), iterations:SHOWROOM.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(SHOWROOM.iv)}, key, b64(SHOWROOM.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

const app = document.getElementById('app');

  <div class="meta">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}${fmt(p.date)}, ${p.mins} min read</div>
</li>`;

let firstLoad = true;
const views = {
  home(){
    return `<div class="hero">

  blog(){

    return `<section class="page">
      <h1>Blog</h1>
      <p class="lede">Notes on Vistex, SAP pricing design, integration and delivery. Examples are simplified and never describe a specific client.</p>
      <div class="filters" role="group" aria-label="Filter by topic">

  post(slug){

    if(!p) return `<section class="page"><h1>Post not found</h1><p class="lede">That link doesn't match any post. <a href="#/blog">See all posts</a>.</p></section>`;
    return `<section class="page"><article class="post">

  about(){
    return `<section class="page prose">
      <h1>About</h1>
      <p class="lede">I work where commercial agreements meet system design.</p>
      <div style="margin-top:32px">
        <p>I've spent more than 18 years in SAP, most of it on pricing and on Vistex: customer and vendor rebates, incentives, billbacks and chargebacks, and more recently DMP pricing on S/4HANA. My work covers the whole cycle, from requirement workshops and FIT-GAP analysis through process design, functional specifications, configuration and testing to go-live and day-to-day support.</p>
        <p>For seventeen years I was at Ingram Micro, the world's largest technology distributor. I started on the initial blueprint of its global SAP template, helped take it through eight full-cycle deployments on five continents, and later led engineering teams on Xvantage, the company's digital platform, connecting it to SAP and Vistex behind the scenes.</p>
        <p>That mix of functional and engineering work shapes how I design. I care about solutions that hold up at volume, can be explained with a worked example, and leave finance with numbers it can reconcile. I started my career as a systems engineer, with degrees in systems and automation engineering, and I still think in terms of flows, controls and failure modes.</p>

      <span class="demoactions"><button type="button" class="linkbtn" id="fullscreen">Full screen</button><button type="button" class="linkbtn" id="lock">Lock showroom</button></span>
    </div>
    <div class="demoframe" id="demowrap"><iframe id="demo" title="${showroom.demos[openDemo].title}"></iframe></div>`;
    if(showroom) return `<section class="page">
      <div class="showhead"><h1>Showroom</h1><button type="button" class="linkbtn" id="lock">Lock showroom</button></div>
      ${showroom.intro}
    </section>`;
    return `<section class="page">
      <h1>Showroom</h1>
      <p class="lede">Private work samples and demos. Sign in with the details I've shared with you.</p>
      <form class="gate" id="gate" autocomplete="off">
        <label for="su">Username</label>
        <input id="su" name="username" autocomplete="username" required>
        <label for="sp">Password</label>
        <input id="sp" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
        <p class="err" id="gerr" role="alert"></p>
      </form>
    </section>`;
  },
  contact(){
    return `<section class="page prose">
      <h1>Contact</h1>
      <p class="lede">Open to conversations about SAP Vistex and pricing projects, remote or with occasional travel.</p>
      <ul class="contact-list">
        <li><span>Email</span><a href="mailto:ferhan@ferhanezgin.com">ferhan@ferhanezgin.com</a></li>
        <li><span>LinkedIn</span><a href="https://www.linkedin.com/" rel="noopener">linkedin.com/in/<span class="placeholder">[handle]</span></a></li>
        <li><span>Working</span><span>Remote, occasional travel possible</span></li>
      </ul>
    </section>`;
  }
};

let currentPath = (location.hash||'').replace(/^#\/?/,'');
function render(){
  const parts = (currentPath||'').split('/');
  const route = parts[0]||'home';
  if(route!=='showroom') openDemo=null;
  document.body.classList.toggle('demo', !!(route==='showroom' && showroom && openDemo));
  let html, nav=route;
  if(route==='blog' && parts[1]){ html = views.post(parts[1]); nav='blog'; }
  else html = (views[route]||views.home)();
  app.innerHTML = html;
  document.querySelectorAll('nav a').forEach(a=>{
    if(a.dataset.nav===nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  const titles={home:'SAP Vistex consultant',blog:'Blog',about:'About',contact:'Contact',showroom:'Showroom'};
  const post = route==='blog'&&parts[1]?POSTS.find(x=>x.slug===parts[1]):null;
  document.title = 'Ferhan Ezgin · ' + (post?post.title:(titles[nav]||titles.home));
  if(!firstLoad){ window.scrollTo(0,0); app.focus({preventScroll:true}); }
  firstLoad=false;
  const f = app.querySelector('.filters');
  if(f) f.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    f.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const t=b.dataset.tag;
    const list=POSTS.filter(p=>t==='All'||p.tags.includes(t));
    document.getElementById('postlist').innerHTML=list.map(postItem).join('');
  });
  const g = document.getElementById('gate');
  if(g){
    document.getElementById('su').focus();
    g.addEventListener('submit', async e=>{
      e.preventDefault();
      const btn=g.querySelector('button'), err=document.getElementById('gerr');
      btn.disabled=true; btn.textContent='Signing in'; err.textContent='';
      try{
        showroom = await unlockShowroom(g.username.value.trim(), g.password.value);
        render();
      }catch(_){
        err.textContent='Username or password is incorrect. Check them and try again.';
        btn.disabled=false; btn.textContent='Sign in';
        g.password.value=''; g.password.focus();
      }
    });
  }
  const lk = document.getElementById('lock');
  if(lk) lk.addEventListener('click',()=>{ showroom=null; openDemo=null; render(); });
  app.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>{ openDemo=b.dataset.demo; render(); window.scrollTo(0,0); }));
  const fs = document.getElementById('fullscreen');
  if(fs){
    const wrap=document.getElementById('demowrap');
    if(!(wrap.requestFullscreen||wrap.webkitRequestFullscreen)) fs.style.display='none';
    fs.addEventListener('click',()=>{ try{ (wrap.requestFullscreen||wrap.webkitRequestFullscreen).call(wrap); }catch(_){ fs.style.display='none'; } });
  }
  const cd = document.getElementById('closedemo');
  if(cd) cd.addEventListener('click',()=>{ openDemo=null; render(); });
  const fr = document.getElementById('demo');
  if(fr){
    const fit = ()=>{ try{
      const wrap=document.getElementById('demowrap');
      if(document.fullscreenElement===wrap){ fr.style.height='100vh'; return; }
      if(window.innerWidth>720){ const bar=document.querySelector('.demobar'); fr.style.height=Math.max(520, window.innerHeight-(bar?bar.offsetHeight:0))+'px'; return; }
      const d=fr.contentDocument; if(d&&d.documentElement) fr.style.height=d.documentElement.scrollHeight+'px';
    }catch(_){} };
    window.addEventListener('resize',fit); document.addEventListener('fullscreenchange',fit);
    fr.addEventListener('load',()=>{
      fit();
      try{ new ResizeObserver(fit).observe(fr.contentDocument.body); }catch(_){ setInterval(fit,1000); }
    });
    fit();
    fr.srcdoc = showroom.demos[openDemo].html;
  }
}
// In-page navigation: handle links here so they never leave the page.
function go(path){
  currentPath = path;
  try{ history.pushState({path}, '', '#/'+path); }catch(_){}
  render();
}
document.addEventListener('click', e=>{
  const a = e.target.closest('a[href^="#/"], a[href="#"]');
  if(!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button!==0) return;
  e.preventDefault();
  go(a.getAttribute('href').replace(/^#\/?/,''));
});
window.addEventListener('popstate', e=>{
  currentPath = (e.state && typeof e.state.path==='string') ? e.state.path : (location.hash||'').replace(/^#\/?/,'');
  render();
});
window.addEventListener('hashchange', ()=>{
  const h=(location.hash||'').replace(/^#\/?/,'');
  if(h!==currentPath){ currentPath=h; render(); }
});
render();
</script>
</body>
</html>
